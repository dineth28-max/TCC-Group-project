name: CD part

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    defaults:
      run:
        working-directory: /home/ubuntu/TCC

    env:
      DEPLOY_DIR: /home/ubuntu/TCC/nginx

      COMPOSE_FILE: tc.yml
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: checkout repo (for nginx config)
        uses: actions/checkout@v4
        with:
          path: repo

      - name: sync nginx config to deploy dir
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf "$DEPLOY_DIR/nginx.conf"
          sudo mkdir -p "$DEPLOY_DIR"
          sudo cp "$GITHUB_WORKSPACE/repo/nginx/nginx.conf" "$DEPLOY_DIR/nginx.conf"

      - name: docker login
        shell: bash
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: free ports held by stale containers
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"

          echo "Stopping this project's existing containers (if any)"
          sudo -E docker compose -f "$COMPOSE_FILE" down --remove-orphans || true

          echo "Force-removing any stale containers with our fixed names (from old/renamed compose projects)"
          sudo docker rm -f csmas.mysql csmas.backend csmas.frontend csmas.nginx csmas.adminer 2>/dev/null || true

          echo "Checking for other containers still holding our host ports"
          for port in 3307 18080 3000 8090 18081; do
            cid=$(sudo docker ps -q --filter "publish=$port")
            if [ -n "$cid" ]; then
              echo "Port $port is held by container $cid, stopping it"
              sudo docker stop "$cid"
            fi
          done

          echo "Stopping any host-level web server holding port 80/443"
          sudo systemctl stop nginx 2>/dev/null || true
          sudo systemctl disable nginx 2>/dev/null || true
          sudo systemctl stop apache2 2>/dev/null || true
          sudo systemctl disable apache2 2>/dev/null || true




      - name: recreate containers with latest images
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"

          echo "Pulling latest images"
          sudo -E docker compose -f "$COMPOSE_FILE" pull

          sudo -E docker compose -f "$COMPOSE_FILE" up -d

          echo "Cleaning up old images"
          sudo docker image prune -f
