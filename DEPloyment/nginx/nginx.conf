events {}

http {
    include       mime.types;
    sendfile      on;

    # Backend accepts document uploads up to 5 MB (StudentsController); nginx's 1 MB default
    # would reject anything bigger with a 413 before it ever reaches the backend.
    client_max_body_size 10m;

    # Docker's embedded DNS. Upstreams are resolved per request (via the variables below) instead
    # of once at startup, so nginx still starts — and recovers — while backend/frontend are
    # restarting, rather than crash-looping on "host not found in upstream".
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        set $backend  http://backend:8080;
        set $frontend http://frontend:80;

        # AI Risk Engine: the browser calls /api/admin/risk-students on the backend (proxied by
        # /api/ below), and the backend calls ai-service:5001 internally. No public route to
        # ai-service on purpose — its /train endpoint is unauthenticated.

        location /api/ {
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # ASP.NET Core's ForwardedHeadersMiddleware reads this to recover the real client IP —
            # without it, every anonymous request (login, mainly) appears to come from nginx's own
            # container address, collapsing the per-IP rate-limit fallback into one shared bucket.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /hangfire {
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend liveness/readiness — without this, an external monitor hitting /healthz would
        # silently land on the frontend's static SPA shell instead of the backend's real check.
        location /healthz {
            proxy_pass $backend;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass $frontend;
            proxy_set_header Host $host;
        }
    }
}
