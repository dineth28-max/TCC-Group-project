events {}

http {
    include       mime.types;
    sendfile      on;

    # Backend accepts document uploads up to 5 MB (StudentsController); nginx's 1 MB default
    # would reject anything bigger with a 413 before it ever reaches the backend.
    client_max_body_size 10m;

    # Plain HTTP: redirect everything to HTTPS, except /healthz which stays on port 80 too so a
    # monitor that doesn't speak TLS can still reach it (plan.md §8 / Phase 10 health-check fix).
    server {
        listen 80;

        location /healthz {
            proxy_pass http://backend:8080/healthz;
            proxy_set_header Host $host;
        }

        # Host port 443 is published as 8443 (tc.yml), so the redirect must name that port —
        # a bare https://$host would send browsers to 443, where nothing is listening.
        location / {
            return 301 https://$host:8443$request_uri;
        }
    }

    server {
        listen 443 ssl;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Phase 16: the plain-HTTP redirect only protects requests made *after* a browser already
        # knows to use HTTPS — HSTS tells the browser to rewrite future requests to https:// itself.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # /api/risk/ -> ai-service: disabled until Phase 8 (AI Risk Engine) re-enables that container.

        location /api/ {
            proxy_pass http://backend:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # ASP.NET Core's ForwardedHeadersMiddleware reads this to recover the real client IP —
            # without it, every anonymous request (login, mainly) appears to come from nginx's own
            # container address, collapsing the per-IP rate-limit fallback into one shared bucket.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /hangfire {
            proxy_pass http://backend:8080/hangfire;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend liveness/readiness, reachable from outside the Docker network exactly like
        # any other API route — without this, an external monitor hitting /healthz would
        # silently land on the frontend's static SPA shell instead of the backend's real check.
        location /healthz {
            proxy_pass http://backend:8080/healthz;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://frontend:80/;
            proxy_set_header Host $host;
        }
    }
}
