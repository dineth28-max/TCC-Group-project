services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      # TCP (127.0.0.1), not the "localhost" socket: on a fresh volume MySQL runs a temporary
      # socket-only server during init, and a socket ping would report healthy before the real
      # server is accepting the backend's network connections.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Server=mysql;Database=${DB_NAME};User=root;Password=${DB_ROOT_PASSWORD};"
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: csmas
      Jwt__Audience: csmas-clients
      FrontendOrigin: ${FRONTEND_ORIGIN}
      Smtp__User: ${SMTP_USER}
      Smtp__Pass: ${SMTP_PASS}
      AiService__BaseUrl: "http://ai-service:5001"
    volumes:
      - backend_uploads:/app/uploads
      - backend_keys:/app/keys
    depends_on:
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_started
    ports:
      - "18080:8080"

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./ai-service/model:/app/model
    ports:
      - "5001:5001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "3000:80"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"

  adminer:
    image: adminer
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "18081:8080"

volumes:
  mysql_data:
  backend_uploads:
  backend_keys:
