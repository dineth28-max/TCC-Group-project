services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=mysql;Database=${DB_NAME};User=root;Password=${DB_ROOT_PASSWORD};"
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: csmas
      Jwt__Audience: csmas-clients
      FrontendOrigin: ${FRONTEND_ORIGIN}
      Smtp__User: ${SMTP_USER}
      Smtp__Pass: ${SMTP_PASS}
    volumes:
      - backend_uploads:/app/uploads
      - backend_keys:/app/keys
    ports:
      - "18080:8080"

  # ai-service: temporarily disabled — not needed yet, re-enable for Phase 8 (AI Risk Engine).
  # ai-service:
  #   build:
  #     context: ./ai-service
  #     dockerfile: Dockerfile
  #   restart: unless-stopped
  #   volumes:
  #     - ./ai-service/models:/app/models
  #   ports:
  #     - "5000:5000"
  #

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "3000:80"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"

  adminer:
    image: adminer
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "18081:8080"

volumes:
  mysql_data:
  backend_uploads:
  backend_keys:
