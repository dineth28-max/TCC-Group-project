events {}

http {
    include       mime.types;
    sendfile      on;

    server {
        listen 80;

        # /api/risk/ -> ai-service: disabled until Phase 8 (AI Risk Engine) re-enables that container.

        location /api/ {
            proxy_pass http://backend:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # ASP.NET Core's ForwardedHeadersMiddleware reads this to recover the real client IP —
            # without it, every anonymous request (login, mainly) appears to come from nginx's own
            # container address, collapsing the per-IP rate-limit fallback into one shared bucket.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /hangfire {
            proxy_pass http://backend:8080/hangfire;
            proxy_set_header Host $host;
        }

        location /healthz {
            proxy_pass http://backend:8080/healthz;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://frontend:80/;
            proxy_set_header Host $host;
        }
    }
}
