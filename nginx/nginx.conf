events {}

http {
    include       mime.types;
    sendfile      on;

    # Plain HTTP: redirect everything to HTTPS, except /healthz which stays on port 80 too so a
    # monitor that doesn't speak TLS can still reach it (plan.md §8 / Phase 10 health-check fix).
    server {
        listen 80;

        location /healthz {
            proxy_pass http://backend:8080/healthz;
            proxy_set_header Host $host;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Phase 16: the plain-HTTP redirect (line ~18) only protects requests made *after* a browser
        # already knows to use HTTPS — a user's very first typed/bookmarked http:// request can still
        # be intercepted before that redirect ever happens. HSTS tells the browser to rewrite future
        # requests to https:// itself, closing that gap on every visit after the first.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # /api/risk/ -> ai-service: disabled until Phase 8 (AI Risk Engine) re-enables that container.

        location /api/ {
            proxy_pass http://backend:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # ASP.NET Core's ForwardedHeadersMiddleware reads this to recover the real client IP —
            # without it, every anonymous request (login, mainly) appears to come from nginx's own
            # container address, collapsing the per-IP rate-limit fallback into one shared bucket.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /hangfire {
            proxy_pass http://backend:8080/hangfire;
            proxy_set_header Host $host;
        }

        # Backend liveness/readiness, reachable from outside the Docker network exactly like
        # any other API route — without this, an external monitor hitting /healthz would
        # silently land on the frontend's static SPA shell instead of the backend's real check.
        location /healthz {
            proxy_pass http://backend:8080/healthz;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://frontend:80/;
            proxy_set_header Host $host;
        }
    }
}
